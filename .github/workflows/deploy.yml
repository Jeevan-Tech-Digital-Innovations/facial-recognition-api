name: Build & Deploy Facial Recognition API to Coolify

on:
  push:
    branches:
      - deploy/staging
      - deploy/production
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Determine environment from branch
  # ---------------------------------------------------------------
  setup:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      env_tag: ${{ steps.resolve.outputs.env_tag }}
    steps:
      - name: Resolve target environment
        id: resolve
        run: |
          if [[ "${{ github.ref_name }}" == "deploy/production" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "env_tag=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "env_tag=staging" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------
  # Build Docker image and push to Docker Hub
  # ---------------------------------------------------------------
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 45
    environment: ${{ needs.setup.outputs.environment }}

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        id: docker-login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Check Docker login result
        if: steps.docker-login.outcome == 'failure'
        run: |
          echo "❌ Docker login failed!"
          echo ""
          echo "Common issues:"
          echo "1. DOCKER_PASSWORD must be an ACCESS TOKEN (not your password)"
          echo "   → Create at: https://hub.docker.com/settings/security"
          echo "   → Token format: dckr_pat_xxxxx"
          echo ""
          echo "2. Check if token has expired"
          echo "3. Verify token has Read, Write, Delete permissions"
          echo "4. Verify DOCKER_USERNAME matches your Docker Hub username"
          exit 1

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/facial_recognition_api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.setup.outputs.env_tag }}
            type=sha,prefix=${{ needs.setup.outputs.env_tag }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ENV=${{ needs.setup.outputs.env_tag == 'production' && 'production' || 'staging' }}
            APP_VERSION=${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/facial_recognition_api:buildcache-${{ needs.setup.outputs.env_tag }}
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/facial_recognition_api:buildcache-${{ needs.setup.outputs.env_tag }},mode=max
          provenance: false

      - name: Verify image was pushed
        run: |
          echo "✅ Facial Recognition API image built and pushed successfully"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ---------------------------------------------------------------
  # Sync env vars to Coolify, then trigger deploy
  # ---------------------------------------------------------------
  deploy:
    name: Trigger Coolify Deploy
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    timeout-minutes: 5
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      # --- Push all runtime env vars into Coolify before the redeploy ---
      - name: Sync env vars to Coolify
        run: |
          COOLIFY_API=$(echo "${{ secrets.COOLIFY_WEBHOOK }}" | grep -oP 'https?://[^/]+')
          APP_UUID="${{ vars.COOLIFY_APP_UUID }}"

          PAYLOAD=$(python3 - <<'PYEOF'
          import json, sys
          envs = {
              "DB_HOST":                        "${{ secrets.DB_HOST }}",
              "DB_PORT":                        "${{ secrets.DB_PORT }}",
              "DB_NAME":                        "${{ secrets.DB_NAME }}",
              "DB_USER":                        "${{ secrets.DB_USER }}",
              "DB_PASSWORD":                    "${{ secrets.DB_PASSWORD }}",
              "FACE_MATCH_THRESHOLD":           "${{ secrets.FACE_MATCH_THRESHOLD }}",
              "FACE_MODEL":                     "${{ secrets.FACE_MODEL }}",
              "FACE_DETECTOR":                  "${{ secrets.FACE_DETECTOR }}",
              "APP_HOST":                       "0.0.0.0",
              "APP_PORT":                       "8000",
              "CORS_ORIGINS":                   "${{ secrets.CORS_ORIGINS }}",
              "APP_TIMEZONE":                   "${{ secrets.APP_TIMEZONE }}",
              "FACE_IMAGES_DIR":                "face_images",
              "PAYROLL_API_BASE_URL":           "${{ secrets.PAYROLL_API_BASE_URL }}",
              "PAYROLL_API_KEY":                "${{ secrets.PAYROLL_API_KEY }}",
              "PAYROLL_EMPLOYEE_SYNC_ENABLED":  "${{ secrets.PAYROLL_EMPLOYEE_SYNC_ENABLED }}",
          }
          payload = {"data": [{"key": k, "value": v, "is_preview": False} for k, v in envs.items()]}
          print(json.dumps(payload))
          PYEOF
          )

          HTTP_STATUS=$(curl --silent --show-error --output /tmp/env_sync_response.txt --write-out "%{http_code}" \
            --request PATCH \
            --url "$COOLIFY_API/api/v1/applications/$APP_UUID/envs/bulk" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --connect-timeout 10 \
            --max-time 30)

          echo "Env sync HTTP Status: $HTTP_STATUS"
          cat /tmp/env_sync_response.txt
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Env vars synced to Coolify."
          else
            echo "❌ Failed to sync env vars (HTTP $HTTP_STATUS)"
            exit 1
          fi

      # --- Wait for Docker Hub registry propagation ---
      - name: Wait for registry propagation
        run: |
          echo "Waiting 15s for Docker Hub to fully propagate the new image..."
          sleep 15

      # --- Trigger Coolify to pull the new image and restart container ---
      - name: Trigger Coolify webhook
        run: |
          echo "Webhook URL (masked): $(echo "${{ secrets.COOLIFY_WEBHOOK }}" | sed 's|//.*@|//***@|; s|/deploy/.*|/deploy/***|')"

          MAX_RETRIES=3
          RETRY_DELAY=10
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            echo "--- Attempt $ATTEMPT of $MAX_RETRIES ---"
            HTTP_STATUS=$(curl --silent --show-error --output /tmp/coolify_response.txt --write-out "%{http_code}" \
              --request GET \
              --url "${{ secrets.COOLIFY_WEBHOOK }}" \
              --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              --header "Content-Type: application/json" \
              --connect-timeout 10 \
              --max-time 30)

            echo "HTTP Status: $HTTP_STATUS"
            echo "Response:"
            cat /tmp/coolify_response.txt
            echo ""

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Coolify deployment triggered successfully for ${{ needs.setup.outputs.env_tag }}."
              exit 0
            fi

            echo "⚠️ Attempt $ATTEMPT failed (HTTP $HTTP_STATUS)"
            if [ $ATTEMPT -lt $MAX_RETRIES ]; then
              echo "Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "❌ Coolify webhook failed after $MAX_RETRIES attempts"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo ""
          echo "══════════════════════════════════════════"
          echo " Facial Recognition API Deploy Complete"
          echo "══════════════════════════════════════════"
          echo " Environment : ${{ needs.setup.outputs.env_tag }}"
          echo " Image       : ${{ secrets.DOCKER_USERNAME }}/facial_recognition_api:${{ needs.setup.outputs.env_tag }}"
          echo " Commit SHA  : ${{ github.sha }}"
          if [ -n "${{ vars.APP_URL }}" ]; then
            echo " URL         : ${{ vars.APP_URL }}"
          fi
          echo "══════════════════════════════════════════"
