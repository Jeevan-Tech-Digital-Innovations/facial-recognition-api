name: Build & Deploy to Coolify

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Determine environment from branch
  # ---------------------------------------------------------------
  setup:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      env_tag: ${{ steps.resolve.outputs.env_tag }}
    steps:
      - name: Resolve target environment
        id: resolve
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "env_tag=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "env_tag=staging" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------
  # Build Docker image and push to Docker Hub
  # ---------------------------------------------------------------
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 45
    environment: ${{ needs.setup.outputs.environment }}

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run linting
        run: |
          pip install -r requirements.txt
          python -c "import py_compile; import glob; [py_compile.compile(f, doraise=True) for f in glob.glob('app/**/*.py', recursive=True)]"
          echo "✅ All Python files compile successfully"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        id: docker-login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Check Docker login result
        if: steps.docker-login.outcome == 'failure'
        run: |
          echo "❌ Docker login failed!"
          echo ""
          echo "Common issues:"
          echo "1. DOCKER_PASSWORD must be an ACCESS TOKEN (not your password)"
          echo "   → Create at: https://hub.docker.com/settings/security"
          echo "   → Token format: dckr_pat_xxxxx"
          echo ""
          echo "2. Check if token has expired"
          echo "3. Verify token has Read, Write, Delete permissions"
          echo "4. Verify DOCKER_USERNAME matches your Docker Hub username"
          exit 1

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/facial-recognition-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.setup.outputs.env_tag }}
            type=sha,prefix=${{ needs.setup.outputs.env_tag }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ENV=${{ needs.setup.outputs.env_tag == 'production' && 'production' || 'staging' }}
            APP_VERSION=${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/facial-recognition-api:buildcache-${{ needs.setup.outputs.env_tag }}
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/facial-recognition-api:buildcache-${{ needs.setup.outputs.env_tag }},mode=max
          provenance: false

      - name: Verify image was pushed
        run: |
          echo "✅ Facial Recognition API image built and pushed successfully"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ---------------------------------------------------------------
  # Trigger Coolify redeployment via webhook
  # ---------------------------------------------------------------
  deploy:
    name: Trigger Coolify Deploy
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    timeout-minutes: 5
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Trigger Coolify webhook
        run: |
          echo "Webhook URL (masked): $(echo "${{ secrets.COOLIFY_WEBHOOK }}" | sed 's|//.*@|//***@|; s|/deploy/.*|/deploy/***|')"
          HTTP_STATUS=$(curl --silent --show-error --output /tmp/coolify_response.txt --write-out "%{http_code}" \
            --request GET \
            --url "${{ secrets.COOLIFY_WEBHOOK }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            --header "Content-Type: application/json" \
            --connect-timeout 10 \
            --max-time 30)

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/coolify_response.txt
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Coolify deployment triggered successfully for ${{ needs.setup.outputs.env_tag }}."
          else
            echo "❌ Coolify webhook failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Deployment summary
        if: success()
        run: |
          echo ""
          echo "════════════════════════════════════"
          echo " Deployment Complete"
          echo "════════════════════════════════════"
          echo " Environment : ${{ needs.setup.outputs.env_tag }}"
          echo " Image       : ${{ secrets.DOCKER_USERNAME }}/facial-recognition-api:${{ needs.setup.outputs.env_tag }}"
          echo " Commit SHA  : ${{ github.sha }}"
          if [ -n "${{ vars.APP_URL }}" ]; then
            echo " URL         : ${{ vars.APP_URL }}"
          fi
          echo "════════════════════════════════════"
